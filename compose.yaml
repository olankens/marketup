services:
  mongodb:
    image: mongo:7.0.43
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  inventory-db:
    image: mysql:8
    container_name: inventory-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory-db
    volumes:
      - inventory_data:/var/lib/mysql

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: order-db
    volumes:
      - order_data:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloak-db
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-data:/config-data
    depends_on:
      discovery-server:
        condition: service_started

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      SPRING_CLOUD_CONFIG_RETRY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_RETRY_MAX-ATTEMPTS: "20"
      SPRING_CLOUD_CONFIG_RETRY_MAX-INTERVAL: "10000"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL-INTERVAL: "5000"
    depends_on:
      - config-server
      - discovery-server
      - keycloak

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8080"
    environment:
      SPRING_CLOUD_CONFIG_RETRY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_RETRY_MAX-ATTEMPTS: "20"
      SPRING_CLOUD_CONFIG_RETRY_MAX-INTERVAL: "10000"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL-INTERVAL: "5000"
    depends_on:
      - config-server
      - discovery-server
      - mongodb

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8082:8081"
    environment:
      SPRING_CLOUD_CONFIG_RETRY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_RETRY_MAX-ATTEMPTS: "20"
      SPRING_CLOUD_CONFIG_RETRY_MAX-INTERVAL: "10000"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL-INTERVAL: "5000"
    depends_on:
      - config-server
      - discovery-server
      - order-db
      - keycloak

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8083:8082"
    environment:
      SPRING_CLOUD_CONFIG_RETRY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_RETRY_MAX-ATTEMPTS: "20"
      SPRING_CLOUD_CONFIG_RETRY_MAX-INTERVAL: "10000"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL-INTERVAL: "5000"
    depends_on:
      - config-server
      - discovery-server
      - inventory-db

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8083"
    depends_on:
      - rabbitmq

volumes:
  mongo_data:
  inventory_data:
  order_data:
  keycloak_data:
  rabbitmq_data: